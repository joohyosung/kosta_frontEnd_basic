<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h2>this 개념 - 호출한 주체에 의해서 this가 결정</h2>
    <button id="btn1" name="click1">클릭1</button>
    <button id="btn2" name="click2">클릭2</button>
    <button id="btn3">클릭3</button>
    <button id="btn4">클릭4</button>
    <script>
      console.log("------ex1------");
      console.log(this);
      console.log(this.name);

      const student = {
        name: "kim",
        print: function () {
          console.log(this);
          console.log(this.name);
        },
      };

      // print 함수 호출
      console.log("------ex2------");
      student.print();

      console.log("------ex3------");
      const myprint = student.print;

      myprint();

      console.log("------ex4------");
      document.querySelector("#btn1").addEventListener("click", student.print);
      document.querySelector("#btn2").addEventListener("click", myprint);

      console.log("------ex5------");
      document.querySelector("#btn3").addEventListener("click", function (e) {
        console.log(this);
        console.log(event.target);
        console.log(e);
        console.log(event);
      });
      console.log("------ex6------");
      document.querySelector("#btn4").addEventListener("click", (e) => {
        console.log(this);
        console.log(event.target);
        console.log(e);
        console.log(event);
      });

      console.log("------ex7------");
      const user = {
        name: "Alice",
        show: function () {
          setTimeout(() => {
            console.log(this); //{name: 'Alice', show: ƒ}
            console.log(this.name); //Alice
          }, 1000);
        },
      };

      user.show(); // Alice
    </script>
  </body>
</html>
