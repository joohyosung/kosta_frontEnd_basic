<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h4>변수에 대해 알아보자 (var - ES5 이전), (let vs const - ES6)</h4>
    <script>
      // 변수 선언 하는 방법
      /*
        var 변수이름;
        var 변수이름 = 값;
        변수이름 = 값; // var 키워드 생략 가능(전역 변수에서만)
        */
      var a;
      var b = 20;
      c = 3.14; // var 키워드 생략

      //브라우저 출력
      document.write("<h4>");
      document.write("a = " + a + ", " + typeof a + "<br>");
      document.write("b = " + b + ", " + typeof b + "<br>");
      document.write("c = " + c + ", " + typeof c + "<hr>");

      //값변경
      a = "안녕하세요";
      b = new Array(1, "hi", 20, 3.14, true);
      c = false;

      document.write("<h4>");
      document.write("a = " + a + ", " + typeof a + "<br>");
      document.write("b = " + b + ", " + typeof b + "<br>");
      document.write("c = " + c + ", " + typeof c + "<hr>");

      // var의 특징 학습
      // 자바스크립트 호이스팅 개념 - 값을 제외한 변수를 맨 위에서 메모리에 먼저 올린다.
      //                            함수는 선언한 내용 전체가 메모리에 먼저 올라간다.

      // 1. var - 동일한 이름의 변수 또는 함수를 또 선언한다면? -ok
      var a = "졸지마세요";
      document.write("a = " + a + ", " + typeof a + "<br>");

      // 2. var - 변수 또는 함수를 선언 전에 사용한다면? -ok
      document.write("age = " + age + ", " + typeof age + "<br>");
      document.write("addr = " + addr + ", " + typeof addr + "<hr>");

      var age;
      var addr = "seoul";
      document.write("<h4>");
    </script>
    <h3>함수 만들어보자 - 호이스팅 test</h3>
    <script>
      test(); // 함수 호출

      // 함수 선언문 문법
      function test() {
        alert("1");
      }

      function test() {
        alert("2");
      }
    </script>
    <hr />
    <h3>변수의 scope에 대해 알아보자</h3>
    <script>
      // 자바에서는 {} -> 블록 단위로 scope 결정
      var i = 0; // 전역변수
      function test2() {
        var i = 5; // 지역변수
        var j = 20; // 지역변수
        k = 50; // var를 생략하면 무조건 전역변수가 된다.

        console.log("i = " + i);
        console.log("this.i = " + this.i);
        console.log("j = " + j);
        console.log("k = " + k);
      }

      test2();

      function test3() {
        console.log("test call");
        console.log("i = " + i);
        console.log("this.i = " + this.i);
        // console.log("j = " + j);
        console.log("k = " + k);

        console.log("전 : index " + index);
        // 자바스크립트는 변수의 scope이 선언 위치의 함수 단위이다. 즉 {} 블록단위 아니다.
        for (var index = 0; index <= 10; index++) {
          //기능
        }

        console.log("후 : index " + index);
      }

      test3();
    </script>
  </body>
</html>
