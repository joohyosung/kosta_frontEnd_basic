<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h3>Object 만들기 (key와 value 개념)</h3>
    <script>
      // 객체 만들기
      const person = {
        name: "hyosung",
        age: 32,
        print: () => {
          console.log("person의 printcall");
          return this.name + "님 나이는 " + this.age + "입니다.";
        },
      };

      // 객체 접근
      console.log(person);
      console.log(person.name);
      console.log(person.age);

      console.log(person["name"]);
      console.log(person["age"]);

      console.log("======================");

      person.name = "hyosung";
      person.age = 32;

      let re = person.print();
      console.log(re);

      console.log("======================");
      // object의 key와 value를 한 쌍으로 조회
      let keys = Object.keys(person);
      console.log(keys);
      let values = Object.values(person);
      console.log(values);

      for (let key of keys) {
        console.log(key + " = " + person[key]);
      }
      console.log("======================");
      for (let p in person) {
        console.log(p);
        console.log(person[p]);
      }
    </script>
  </body>
</html>
