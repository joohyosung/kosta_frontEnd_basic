<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h3>eval() 함수 vs new Function()</h3>
    <script>
      let str = "5*3/2+10";
      let str2 = "['a', 'b', 'c']";

      console.log(str);
      console.log(str2);

      //문자열을 자바스크립트의 구문으로 실행
      let re = eval(str);
      console.log(re);

      let re2 = eval(str2);
      console.log(re2);

      let test = function (param) {
        let secret = 100;
        eval(param);

        console.log(secret);
      };

      test("secret=10");
    </script>
    <script>
      /*
            런타임에 받은 문자열을 사용해 함수를 만들 수 있다. 
                - 동적으로 코드를 실행하고 싶을때 사용한다.(주로 수식 계산기)
            함수 표현식과 함수 선언문은 개발자가 직접 스크립트를 작성해야만 함수를 만들 수 있지만,
            new Function이라는 문법을 사용하면 어떤 문자열도 함수로 바꿀 수 있다.

            ex) const f = new Function('a', 'b', 'return a + b');
                첫 번째 ~ (n-1)번째 매개변수 : 함수의 인자 이름들
                마지막 인자 : 함수 본문 (문자열)  
        */
      console.log("============new Function=============");
      re = new Function("return " + str)();
      console.log(re);

      re2 = new Function("return " + str2)();
      console.log(re2);

      let test2 = function (param) {
        let secret = 100;
        new Function(param)();

        console.log(secret);
      };

      test2("secret=10");
    </script>
  </body>
</html>
