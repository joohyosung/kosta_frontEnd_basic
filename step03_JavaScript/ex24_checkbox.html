<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>Document</title>
  </head>
  <body>
    <form>
      <fieldset>
        <legend>취미선택</legend>
        <input type="checkbox" name="all" value="all" />
        <span id="span">전체선택</span>
        <p>
          <input type="checkbox" name="hobby" value="등산" />등산
          <input type="checkbox" name="hobby" value="수영" />수영
          <input type="checkbox" name="hobby" value="낚시" />낚시
          <input type="checkbox" name="hobby" value="놀기" />놀기
          <input type="checkbox" name="hobby" value="먹기" />먹기

          <input type="button" value="클릭" />
        </p>
      </fieldset>
    </form>

    <div id="result"></div>

    <script>
      document.querySelector("[value=클릭]").addEventListener("click", () => {
        // alert(document.querySelectorAll("[name=hobby]")[0].value);
        // document.querySelectorAll("[name=hobby]").forEach((ckEle) => {
        //   if (ckEle.checked) {
        //     alert(ckEle.value);
        //   }
        // });
        let data = "취미: ";
        document.querySelectorAll("[name=hobby]:checked").forEach((ckEle) => {
          data + ckEle.value + ", ";
        });

        // div 테그 안에 data 추가
        document.querySelector("#result").innerHTML = data;
      });

      // 전체 선택 or 전체 해지
      document.querySelector("[name=all]").addEventListener("click", () => {
        // if (event.target.checked) {
        //   document.querySelectorAll("[name=hobby]").forEach((ckEle) => {
        //     ckEle.checked = true;
        //   });
        // } else {
        //   document.querySelectorAll("[name=hobby]").forEach((ckEle) => {
        //     ckEle.checked = false;
        //   });
        // }

        document.querySelectorAll("[name=hobby]").forEach((ckEle) => {
          ckEle.checked = event.target.checked;
        });

        // span 테그 content 내용 변경
        let span = document.querySelector("#span");
        event.target.checked
          ? (span.innerHTML = "전체해지")
          : (span.innerHTML = "전체선택");
      });
    </script>
  </body>
</html>
