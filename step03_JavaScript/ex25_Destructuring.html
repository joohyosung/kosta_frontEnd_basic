<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h3>구조분해 할당 (Destructuring Assignment)</h3>
    <!-- 객체({}) or 배열([])의 값을 쉽게 꺼내어 변수에 할당 할수 있도록 도와주는 문법-->

    <script>
     // 1. 객체 - { }
     const emp={empno:10, ename:"jang" , job:"instructor"};
     {
        //emp객체 있는 속성의 값을 변수에 담고 싶다. - 기존방식
        let empno = emp.empno;
        let ename = emp.ename;
        let job = emp.job;

        console.log(empno, ename, job);
     }

     {
        //새로운 문법 - 구조분해 할당 변경
         let {empno, ename, job} = emp;
         console.log(empno, ename, job);
     }

      {
         let { job, empno} = emp;
         console.log(empno,  job);
     }

     //key=property 와 변수이름이 다른경우
     {
        let {no , name, job} = emp;
        console.log(no,  name, job);
     }

     //key=property 와 변수이름이 다른경우
     {
        let {empno:no , ename:name, job} = emp;
        console.log(no,  name, job);
     }

     //없는 속성명일때 기본값 설정
     {
        let {empno , ename, job , age=20} = emp;
        console.log(empno, ename, job, age);
     }

     console.log("---Array -----");
     const jobs = ["학생","강사"];
     {
        //기존방식 
        let first = jobs[0];
        let second = jobs[1];
         console.log(first, second);
     }

     {
        //구조분해할당
        let [first, second] = jobs;
        console.log(first, second);
     }

     const numbers=[10,20,30,40,50,60,70];
     {
        //앞에 3개만 조회
        let [a,b,c] = numbers;
        console.log(a, b, c);

     }
     {
        //처음과 끝의 두개만 조회
        let [a,,,,b,c] = numbers;
        console.log(a, b, c);

     }

     {
        //a변수와 b변수의 값을 교환하고싶다.
        let a=5 , b=7;
        console.log(a,b);

        [b,a] = [a,b]
        console.log(a,b);
     }
     ///////////////////////////////////////
     console.log("함수 리턴 하는 값 구조분해..")
     //함수 리턴하는 값을 구조분해 할당으로 받기 
     const test = function(){
        //기능
        return [10,20,30] ;
     }

     let result = test();
     console.log(result[0], result[1]);

     let [a,b,c] = test();
     console.log(a, b, c);

     /////////////////////////////////
     const test2 = ()=>{
        //기능
        return {name:"희정", age:20, addr:"서울"};
     }

     let {name, age, addr:address} = test2();
     console.log(name, age, address);

     /////////////////////////////////////////////
    //매개값으로 전달된 객체를 구조분해 하기
    const test3 = function(obj){
        //console.log(obj);
        let info=`사원번호 :${obj.empno} / 이름 : ${obj.ename} / 직업 : ${obj.job}`;
        console.log(info);
    };

    test3(emp);//{empno:10, ename:"jang" , job:"instructor"};

    //////////////////////////////////////////////////////
     const test4 = function({empno, ename:name, job}){
        //console.log(obj);
        let info=`사원번호 :${empno} / 이름 : ${name} / 직업 : ${job}`;
        console.log(info);
    };

    test4(emp);//{empno:10, ename:"jang" , job:"instructor"};

    ///단축속성명 ///////////////////////////////////////////////////
    console.log("--단축속성명 ---")
    {
        let name="heejung";
        let age=30;
        let addr="제주도";

        //객체를 만들자.
        let person={
            name:name,
            age:age,
            addr:addr
        }
  
        console.log(person)


        let person2={
            name,
            age,
            addr
        }
        console.log(person2)
    }


    </script>
    
</body>
</html>
