<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h2>optional chaining 문법 - ?.</h2>
    <script>
      /*
        객체의 속성이나 메소드에 안전하게 접근하기 위한 문법
        : 중첩된 객체구에서 존재하지 않는 속성을 접근을 해도 오류가 발생하지 않고
        undefined를 반환하도록 하는 문법
        */

      const person1 = {
        name: "hyosung",
        job: {
          title: "instructor",
          manager: {
            name: "kim",
          },
        },
      };

      const person2 = {
        name: "jihyun",
      };

      const print = (p) => {
        // 전달된 객체의 manager의 이름을 알고 싶다
        console.log(p.job.manager.name);
      };
      print(person1);
      // optional chaining 문법으로 변경
      const print2 = (p) => {
        let re = p?.job?.manager?.name;
        console.log(re);
      };

      print2(person1);
      print2(person2);
    </script>
  </body>
</html>
