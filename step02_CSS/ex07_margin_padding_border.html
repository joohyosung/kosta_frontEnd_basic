<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      div {
        width: 200px;
        height: 200px;
      }
      div.a {
        background-color: red;
        padding-top: 20px;
        padding-left: 20px;
        box-sizing: border-box;
      }
      div.b {
        background-color: green;
        padding: 20px;
        box-sizing: border-box;
        border-style: dashed dotted;
        border-width: 5px;
        border-color: aquamarine blueviolet beige;
        margin-top: 20px;
        margin-left: 50px;
        margin-bottom: 30px;
        border-radius: 100px 50px 25px 75px;
        opacity: 0.5;
      }
      div.c {
        background-color: blue;
        box-sizing: border-box;
        border: double 10px yellow;
        border-radius: 100px;
        color: white;
        text-align: center;
        vertical-align: middle;
        display: table-cell;
      }
    </style>
  </head>
  <body>
    <div class="a">box모델</div>
    <div class="b">box모델</div>
    <div class="c">box모델</div>
  </body>
</html>
