<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .main {
        height: 100vh;
        background-color: aliceblue;
        display: grid;
        /* grid-template-columns: 100px 200px 50px; */
        /* grid-template-columns: repeat(3, 150px) 100px; */
        grid-template-columns: 1fr 2fr 1fr; /* fraction 사용가능한 공간을 비율로 나눌 때 쓰는 단위 */
        grid-auto-rows: 100px;

        row-gap: 10px;
        column-gap: 10px;
      }

      img {
        width: 100%;
        height: 100%;
      }

      .img1 {
        grid-column-start: 1;
        grid-column-end: 3;
        grid-row-start: 1;
        grid-row-end: 4;
      }

      .img2 {
        grid-column: 3/4;
        grid-row-start: 1;
        grid-row-end: 4;
      }

      .img3 {
        grid-column: 1 / span 2;
        grid-row: 4 / span 2;
      }
    </style>
  </head>
  <body>
    <div class="main">
      <img src="https://picsum.photos/200" alt="렌덤이미지1" class="img1" />
      <img src="https://picsum.photos/200" alt="렌덤이미지2" class="img2" />
      <img src="https://picsum.photos/200" alt="렌덤이미지3" class="img3" />
      <img src="https://picsum.photos/200" alt="렌덤이미지4" class="img4" />
      <img src="https://picsum.photos/200" alt="렌덤이미지5" class="img5" />
      <img src="https://picsum.photos/200" alt="렌덤이미지6" class="img6" />
      <img src="https://picsum.photos/200" alt="렌덤이미지7" class="img7" />
      <img src="https://picsum.photos/200" alt="렌덤이미지8" class="img7" />
      <img src="https://picsum.photos/200" alt="렌덤이미지9" class="img7" />
    </div>
  </body>
</html>
