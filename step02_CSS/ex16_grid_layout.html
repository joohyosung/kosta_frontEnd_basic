<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        height: 100vh;
        width: 100vw;
        background-color: aliceblue;
        display: grid;
        grid-template-columns: 5fr 1fr;
        grid-template-rows: 1fr 5fr 1fr;
        grid-template-areas:
          "header header"
          "main aside"
          "footer footer";
      }

      header {
        background-color: aqua;
        grid-area: header;
        /* grid-column: 1/3; */
      }

      main {
        background-color: yellow;
        grid-area: main;
      }

      aside {
        background-color: pink;
        grid-area: aside;
      }

      footer {
        background-color: beige;
        grid-area: footer;
        /* grid-column: 1/3; */
      }

      img {
        width: 100%;
        height: 100%;
        opacity: 0.8;
        border-radius: 10px;
      }

      .main {
        height: 100%;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        grid-auto-rows: 100px;
        padding: 50px;
        gap: 10px;
        grid-template-areas:
          "a a a"
          "b c c"
          "d e f"
          "g e f";
      }
      .img1 {
        grid-area: a;
      }
      .img2 {
        grid-area: b;
      }
      .img3 {
        grid-area: c;
      }
      .img4 {
        grid-area: d;
      }
      .img5 {
        grid-area: e;
      }
      .img6 {
        grid-area: f;
      }
      .img7 {
        grid-area: g;
      }
    </style>
  </head>
  <body>
    <header>Header</header>
    <main>
      <div class="main">
        <img
          src="https://picsum.photos/id/10/200"
          alt="렌덤이미지1"
          class="img1"
        />
        <img
          src="https://picsum.photos/id/20/200"
          alt="렌덤이미지2"
          class="img2"
        />
        <img
          src="https://picsum.photos/id/30/200"
          alt="렌덤이미지3"
          class="img3"
        />
        <img
          src="https://picsum.photos/id/40/200"
          alt="렌덤이미지4"
          class="img4"
        />
        <img
          src="https://picsum.photos/id/50/200"
          alt="렌덤이미지5"
          class="img5"
        />
        <img
          src="https://picsum.photos/id/60/200"
          alt="렌덤이미지6"
          class="img6"
        />
        <img
          src="https://picsum.photos/id/70/200"
          alt="렌덤이미지7"
          class="img7"
        />
      </div>
    </main>
    <aside>Aside</aside>
    <footer>Footer</footer>
  </body>
</html>
