<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Insert title here</title>
    <link rel="stylesheet" type="text/css" href="css/basic.css" />
    <style type="text/css">
      .poster {
        width: 150px;
        height: 150px;
      }

      a {
        text-decoration: none;
      }
    </style>

    <script type="text/javascript">
      const renderCart = () => {
        // content 초기화
        let content = document.querySelector("#content");
        content.innerHTML = "";

        // localstorage 내 값 불러오기
        let items = [];

        for (let i = 0; i < localStorage.length; i += 1) {
          let key = localStorage.key(i);

          items.push({
            key: key,
            value: localStorage.getItem(key),
          });
        }

        // 정렬
        items.sort((a, b) => {
          return Number(a.key) - Number(b.key);
        });

        // localstorage 값 영역별 나누기
        let total = 0;
        items.forEach((item) => {
          let parts = item.value.split(",");
          if (parts.length < 3) return;

          let name = parts[0];
          let imgsrc = parts[1];
          let price = Number(parts[2]);

          // 표 생성
          let row = document.createElement("tr");
          let imageCell = document.createElement("td");
          let image = document.createElement("img");

          // 이미지 셀 생성
          image.className = "poster";
          image.src = imgsrc;
          image.alt = name;
          imageCell.appendChild(image);

          // 상품코드 셀 생성
          let idCell = document.createElement("td");
          idCell.textContent = item.key;

          // 상품명 셀 생성
          let nameCell = document.createElement("td");
          nameCell.textContent = name;

          // 가격 셀 생성
          let priceCell = document.createElement("td");
          priceCell.textContent = price + "원";

          // 삭제 버튼 생성
          let deleteCell = document.createElement("td");
          let deleteButton = document.createElement("button");

          deleteButton.type = "button";
          deleteButton.textContent = "삭제";

          deleteCell.appendChild(deleteButton);

          // 찜목록 표 생성
          row.append(imageCell, idCell, nameCell, priceCell, deleteCell);
          content.appendChild(row);

          // 총 금액 계산
          total += price;

          // 버튼 클릭 시 localstorage 값 삭제 및 표 내 값 삭제
          deleteButton.addEventListener("click", () => {
            localStorage.removeItem(item.key);
            renderCart();
          });
        });

        document.querySelector("#price").textContent =
          "총 금액: " + total + "원";
      };

      onload = renderCart;
    </script>
  </head>
  <body>
    <hr />
    <article class="main">
      <section>
        <table width="80%" align="center">
          <caption class="caption">
            찜 리스트
          </caption>
          <thead>
            <tr>
              <th>이미지</th>
              <th>상품번호</th>
              <th>상품이름</th>
              <th>가격</th>
              <th>삭제</th>
            </tr>
          </thead>
          <tbody id="content">
            <!-- 찜목록 출력 -->
          </tbody>
        </table>
      </section>
      <section class="toalprice" id="price">
        <!-- 가격 -->
      </section>
      <section class="link">
        <table align="center">
          <tr>
            <td align="center">
              <a href="">주문하러 가기</a>
              <a href="index.html">DVD LIST</a>
            </td>
          </tr>
        </table>
      </section>
    </article>
  </body>
</html>
