<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>순서 있는 목차</h1>
    <ol type="a" start="3">
      <li>
        기아자동차
        <ul>
          <li>k3</li>
          <li>k5</li>
          <li>k7</li>
        </ul>
      </li>

      <li>
        현대자동차
        <ul>
          <li>k3</li>
          <li>k5</li>
          <li>k7</li>
        </ul>
      </li>

      <li>삼성자동차</li>
    </ol>
    <hr />
    <h1>순서 없는 목차</h1>
    <!-- type = "disc | circle | square" -->
    <ul type="circle">
      <li>기아자동차</li>
      <li>현대자동차</li>
      <li>삼성자동차</li>
    </ul>
    <hr />
    <h2>상품구성</h2>
    <!-- 
        dl : Definition List(정의목록, 설명목록)
        dt : Definition Term(정의 용어, 항목 제목)
        dd : Definition Description(용어의 설명, 값)
    -->
    <dl>
      <dt>선물용3kg</dt>
      <dd>소과13~16과</dd>
      <dd>중과10~12과</dd>
    </dl>
    <dl>
      <dt>선물용5kg</dt>
      <dd>중과15~19과</dd>
    </dl>
  </body>
</html>
