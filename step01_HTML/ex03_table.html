<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      table {
        border: 1px solid black;
        width: 200px;
      }
      td {
        border: 1px solid black;
        text-align: center;
      }
      th {
        border: 1px solid black;
        text-align: center;
      }
      thead {
        color: green;
      }
      tbody {
        color: blue;
      }
      tfoot {
        color: red;
      }
    </style>
  </head>
  <body>
    <h1>table 만들기 (3행 2열)</h1>
    <table>
      <tr>
        <th>이름</th>
        <th>나이</th>
      </tr>
      <tr>
        <td>주효성</td>
        <td>32</td>
      </tr>
      <tr>
        <td>하지현</td>
        <td>32</td>
      </tr>
      <tr>
        <td>주하린</td>
        <td>1</td>
      </tr>
    </table>
    <hr />
    <table>
      <caption>
        열병합
      </caption>
      <tr>
        <td colspan="2">A</td>
      </tr>
      <tr>
        <td>B</td>
        <td>C</td>
      </tr>
    </table>
    <hr />
    <table>
      <caption>
        행병합
      </caption>
      <tr>
        <td>A</td>
        <td rowspan="2">B</td>
      </tr>
      <tr>
        <td>C</td>
      </tr>
    </table>
    <hr />
    <table>
      <caption>
        8행3열
      </caption>
      <tr>
        <td colspan="3">A</td>
      </tr>
      <tr>
        <td rowspan="3">b</td>
        <td colspan="2">c</td>
      </tr>
      <tr>
        <td>d</td>
        <td>e</td>
      </tr>
      <tr>
        <td>f</td>
        <td>g</td>
      </tr>
      <tr>
        <td colspan="3">h</td>
      </tr>
      <tr>
        <td rowspan="3">i</td>
        <td>j</td>
        <td>k</td>
      </tr>
      <tr>
        <td>e</td>
        <td>f</td>
      </tr>
      <tr>
        <td>g</td>
        <td>h</td>
      </tr>
    </table>
    <hr />
    <h1>The thead, tbody, and tfoot elements - Styled with CSS</h1>

    <table>
      <thead>
        <tr>
          <th>Month</th>
          <th>Savings</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>January</td>
          <td>$100</td>
        </tr>
        <tr>
          <td>February</td>
          <td>$80</td>
        </tr>
      </tbody>
      <tfoot>
        <tr>
          <td>Sum</td>
          <td>$180</td>
        </tr>
      </tfoot>
    </table>
  </body>
</html>
